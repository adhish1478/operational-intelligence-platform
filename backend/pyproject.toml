[project]
name = "oip-backend"
version = "0.1.0"
description = "Operational Intelligence Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.18",
    "pydantic[email]>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pyjwt[crypto]>=2.8.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ASYNC"]
ignore = []
