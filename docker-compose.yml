services:
  # 1. PostgreSQL Relational Database
  db:
    image: postgres:16-alpine
    container_name: oip_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
      POSTGRES_DB: ${POSTGRES_DB:-oip_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-oip_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. MongoDB Document Database
  mongodb:
    image: mongo:7.0-jammy
    container_name: oip_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # 3. RabbitMQ Message Broker + Management + Prometheus Metrics Plugin
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: oip_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_prometheus expose_footprint true"
    ports:
      - "5672:5672"     # AMQP Broker Protocol
      - "15672:15672"   # Management Web UI
      - "15692:15692"   # Native Prometheus Metrics Plugin Endpoint
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. FastAPI Backend API
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: oip_backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-securepassword}
      - POSTGRES_DB=${POSTGRES_DB:-oip_db}
      - MONGODB_URL=mongodb://mongodb:27017
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 5. RabbitMQ Background Ingest Event Worker
  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: oip_worker
    command: python app/queues/run_worker.py
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-securepassword}
      - POSTGRES_DB=${POSTGRES_DB:-oip_db}
      - MONGODB_URL=mongodb://mongodb:27017
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      - ENVIRONMENT=development
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # 6. React Frontend SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oip_frontend
    ports:
      - "5173:80"

  # 7. Nginx Ingress & HTTPS Webhook Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: oip_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

  # 8. Prometheus Metrics Scraper
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: oip_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - rabbitmq

  # 9. Grafana Observability Dashboard
  grafana:
    image: grafana/grafana:10.4.0
    container_name: oip_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mongodb_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
